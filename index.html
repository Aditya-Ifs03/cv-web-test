<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO — replace [YOUR NAME] and URLs before deploying -->
    <title>[YOUR NAME] — Informatics Student &amp; Developer</title>
    <meta name="description" content="Portfolio of [YOUR NAME], an informatics student and developer building modern web applications. Projects, skills, experience, and contact." />
    <meta name="author" content="[YOUR NAME]" />
    <link rel="canonical" href="https://[YOUR-DOMAIN]/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="[YOUR NAME] — Informatics Student &amp; Developer" />
    <meta property="og:description" content="Projects, skills, and experience of [YOUR NAME]." />
    <meta property="og:url" content="https://[YOUR-DOMAIN]/" />
    <meta property="og:image" content="https://[YOUR-DOMAIN]/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: preconnect + display=swap keeps text visible while loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- Apply saved theme before first paint to avoid a flash -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
